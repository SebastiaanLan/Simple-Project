<table>
    <thead>
        <tr>
            <th>E-mail</th>
            <th>Name</th>
            <th>Phone Number</th>
        </tr>
    </thead>

    <tbody>
        @for (user of users(); track $index) {
            <tr>
                <td>{{ user.email }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.phone }}</td>
            </tr>
        }
    </tbody>
</table>
